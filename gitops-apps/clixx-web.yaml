apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clixx-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nancytcheby/k8s-gitops.git
    targetRevision: HEAD
    path: workloads/clixx-web/deployments
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
